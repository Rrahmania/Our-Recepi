<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rasa Nusantara | Resep & Komunitas</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="container">
  <div class="navbar">
  <div class="navbar-logo">
    <img src="jCAR.png" alt="Logo Rasa Nusantara">
  </div>
  
  <!-- Tombol burger (hanya tampil di mobile) -->
  <button class="burger-btn" id="burgerBtn">
    <i class="fas fa-bars"></i>
  </button>

  <!-- Menu navigasi dan user area (akan disembunyikan di mobile) -->
  <div class="nav-links" id="navLinks">
    <button class="nav-btn active" data-view="home">Beranda</button>
    <button class="nav-btn" data-view="kategori">Kategori</button>
    <button class="nav-btn" data-view="favorite">Favorite</button>
    <button class="nav-btn" data-view="tambah">Tambah Resep</button>
    <button class="nav-btn" data-view="profil">Profil</button>
    <button id="adminDashboardBtn" class="nav-btn" style="display:none;" data-view="admin">Dashboard Admin</button>
    
    <div class="user-area" id="userArea">
      <span id="userGreeting" class="user-greeting"></span>
      <button id="authBtn" class="btn-auth">Login</button>
    </div>
  </div>
</div>
  <div id="mainContent"></div>
</div>
<footer>By Kelompok Alpukat Kocok</footer>

<!-- Modal Konfirmasi Custom -->
<div id="confirmModal" class="confirm-modal">
  <div class="confirm-content">
    <p id="confirmMessage">Apakah Anda yakin?</p>
    <div class="confirm-buttons">
      <button id="confirmYesBtn" class="confirm-yes">Ya, Hapus</button>
      <button id="confirmNoBtn" class="confirm-no">Batal</button>
    </div>
  </div>
</div>

<!-- Modal Login/Register -->
<div id="authModal" class="modal">
  <div class="modal-content" style="max-width: 450px;">
    <button class="close-modal" id="closeAuthModal">&times;</button>
    <h2 id="authTitle">Login</h2>
    <div id="authError" class="warning" style="display:none;"></div>
    <div class="form-grid" style="margin-top:1rem;">
      <div id="usernameField" style="display:none;"><div class="form-row"><label>Username</label><input type="text" id="authUsername" placeholder="Nama pengguna"></div></div>
      <div class="form-row"><label>Email</label><input type="email" id="authEmail" placeholder="email@contoh.com"></div>
      <div class="form-row"><label>Password (min. 8 karakter)</label><input type="password" id="authPassword" placeholder="********"></div>
      <button id="authSubmitBtn" class="btn-submit">Masuk</button>
      <p id="authSwitchText" style="text-align:center; margin-top:1rem;">Belum punya akun? <a href="#" id="switchToRegister">Daftar</a></p>
    </div>
  </div>
</div>

<!-- Modal Detail Resep -->
<div id="recipeModal" class="modal">
  <div class="modal-content">
    <button class="close-modal" id="closeModalBtn">&times;</button>
    <img id="modalImage" class="modal-img" alt="Foto">
    <div style="display: flex; justify-content: space-between; flex-wrap:wrap;">
      <h2 id="modalTitle"></h2>
      <div id="modalAvgRating" class="rating-stars"></div>
    </div>
    <div id="modalMeta" style="margin:8px 0;"></div>
    <h3>Bahan</h3><ul id="modalIngredients"></ul>
    <h3>Langkah</h3><ul id="modalSteps"></ul>
    <h3>Komentar & Rating</h3>
    <div id="commentsList"></div>
    <div id="commentSectionDynamic" class="comment-section"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
